<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>젝시믹스 AI 프롬프트 실습 허브</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;900&family=Outfit:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* 젝시믹스 모던 모노톤 테마 */
        --bg: #f8f9fa;
        --surface: #fff;
        --surface-hover: #f1f3f5;
        --primary: #111111; /* Black */
        --primary-light: #e9ecef;
        --primary-dark: #000000;
        --accent: #495057; /* Dark Gray */
        --accent-light: #f8f9fa;
        --text: #212529;
        --text-secondary: #4a5568;
        --border: #dee2e6;
        --copied-bg: #f1f3f5;
        --copied-border: #111111;
        --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.15);
        --radius: 12px;
        --radius-lg: 20px;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Noto Sans KR", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
        -webkit-font-smoothing: antialiased;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
      }
      .header-inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 64px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        font-size: 16px;
        color: var(--primary);
        text-decoration: none;
      }
      .logo img {
        height: 24px;
        width: auto;
      }
      .hero {
        max-width: 1100px;
        margin: 0 auto;
        padding: 48px 24px 40px;
      }
      .hero-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        background: var(--primary-light);
        color: var(--primary);
        border-radius: 100px;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      .hero h1 {
        font-family: "Outfit", "Noto Sans KR", sans-serif;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 900;
        line-height: 1.3;
        color: var(--primary-dark);
        margin-bottom: 12px;
        letter-spacing: -0.5px;
      }
      .hero h1 span {
        background: linear-gradient(135deg, #111111, #666666);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .hero p {
        font-size: 16px;
        color: var(--text-secondary);
        max-width: 800px;
        word-break: keep-all;
      }
      .content {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 24px 80px;
      }
      .section-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition: box-shadow 0.3s;
        margin-bottom: 32px;
      }
      .section-card:hover {
        box-shadow: var(--shadow-md);
      }
      .section-header {
        padding: 24px 28px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, #fdfdfe, var(--surface));
      }
      .section-icon {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
        background: var(--primary-light);
      }
      
      .section-header-text h2 {
        font-size: 18px;
        font-weight: 700;
        color: var(--primary-dark);
      }
      .section-header-text p {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .section-body {
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Prompt Item */
      .prompt-item {
        position: relative;
        display: flex;
        align-items: flex-start;
        padding: 16px 56px 16px 16px;
        background: var(--bg);
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        font-size: 15px;
        line-height: 1.7;
        color: var(--text);
        user-select: none;
      }
      .prompt-item:hover {
        border-color: var(--border);
        background: var(--surface-hover);
        transform: translateX(4px);
      }
      .prompt-item.copied {
        background: var(--copied-bg);
        border-color: var(--copied-border);
      }
      .prompt-text {
        flex: 1;
        white-space: pre-wrap;
      }
      .prompt-num {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        height: 30px;
        padding: 0 8px;
        background: var(--primary);
        color: #fff;
        border-radius: 8px;
        font-family: "Outfit", sans-serif;
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
        margin-right: 14px;
        margin-top: 2px;
      }
      .copy-indicator {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        pointer-events: none;
      }
      .prompt-item:hover .copy-indicator {
        color: var(--primary);
      }
      .prompt-item.copied .copy-indicator {
        color: var(--primary);
      }
      .copy-indicator svg {
        width: 20px;
        height: 20px;
      }
      .copy-indicator .check-icon {
        display: none;
      }
      .prompt-item.copied .copy-indicator .copy-icon {
        display: none;
      }
      .prompt-item.copied .copy-indicator .check-icon {
        display: block;
      }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 32px;
        left: 50%;
        transform: translateX(-50%) translateY(80px);
        background: var(--primary-dark);
        color: #fff;
        padding: 14px 28px;
        border-radius: 100px;
        font-size: 15px;
        font-weight: 500;
        box-shadow: var(--shadow-lg);
        opacity: 0;
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .header-inner { height: 56px; }
        .hero { padding: 32px 16px 24px; }
        .content { padding: 0 16px 60px; }
        .section-header { padding: 20px 20px 16px; }
        .section-body { padding: 14px; }
        .prompt-item {
          padding: 14px 48px 14px 14px;
          font-size: 14px;
        }
        .prompt-num {
          min-width: 28px;
          height: 26px;
          font-size: 12px;
          margin-right: 12px;
        }
      }

      @keyframes copyPulse {
        0% { box-shadow: 0 0 0 0 rgba(17, 17, 17, 0.2); }
        70% { box-shadow: 0 0 0 8px rgba(17, 17, 17, 0); }
        100% { box-shadow: 0 0 0 0 rgba(17, 17, 17, 0); }
      }
      .prompt-item.just-copied {
        animation: copyPulse 0.6s ease;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <a href="#" class="logo" onclick="return false;">
          <img src="https://igm.or.kr/data/editor/2603/959fd20bcac5ac0ff6de480461687252_1773232873_1591.png" alt="젝시믹스 로고" />
          <span>AI 프롬프트 허브</span>
        </a>
      </div>
    </header>

    <div class="hero">
      <div class="hero-badge">🚀 데이터 분석 & 업무 자동화</div>
      <h1>
        젝시믹스 실무자를 위한 <span>생성형 AI 업무혁명</span><br />
        실전 프롬프트 모음
      </h1>
      <p>
        업무에 바로 활용할 수 있는 프롬프트 템플릿입니다.<br>프롬프트를 클릭하면 클립보드에 복사되어 Copilot, ChatGPT, Claude 등에서 바로 붙여넣기 할 수 있습니다.
      </p>
    </div>

    <div class="content">

      <div class="section-card">
        <div class="section-header">
          <div class="section-icon">📊</div>
          <div class="section-header-text">
            <h2>데이터 분석 및 리포트 자동화 프롬프트</h2>
            <p>엑셀 데이터 분석, 파생변수 생성, VBA 코드 작성 및 데일리 리포트 자동화</p>
          </div>
        </div>
        <div class="section-body">
          <div class="prompt-item" data-num="1" data-prompt="주어진 엑셀의 컬럼을 이해하고 새로운 파생변수 5개를 만들고 복사-붙여넣기를 바로 적용할 수 있도록 파생변수가 컬럼이 되는 표로 표시해줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="2" data-prompt="앞에서 주어진 엑셀파일을 이용해서 시각화 할 수 있는 5개의 차트를 생성하는 VBA코드를 작성해줘.
아래의 사항을 지켜.
- 시계열 차트는 x축은 시간, y 축에 변수를 넣어.
- 목록형 변수에 대한 차트는 x축은 수치, y축에는 변수를 배치한 가로형 막대로 작성해.
- 분포를 표시할 때는 파이차트로 작성한다.
- 두 변수의 상관관계는 분산차트로 작성해.
- 항목이 많은 경우 검색할 수 있는 필터도 넣어줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="3" data-prompt="주어진 엑셀 또는 csv 파일 속 모든 sheet에 있는 컬럼 및 컬럼명을 하나의 sheet로 정리하고 결과를 분석대상 파일과 동일한 위치에 '엑셀메타데이터분석.xlsx'로 저장하는 VBA 작성해줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="4" data-prompt="내가 앞으로 분석할 데이터의 일부이다. 어떤 컬럼과 자료형이 어떤 것인지 확인해봐.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="5" data-prompt="내가 분석할 대상 데이터세트의 메타데이터이다. 먼저 학습해둬라.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="6" data-prompt="이 데이터세트로 새로운 파생변수 5개를 만들고 바로 적용할 수 있도록 함수를 작성해줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="7" data-prompt="파생변수를 포함하여 제공한 데이터를 이용한 분석 주제 N개를 제시해라.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="8" data-prompt="이 데이터세트로 연속형 변수는 기초통계, 목록형 변수는 빈도수 통계를 출력해줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="9" data-prompt="엑셀 데이터를 업로드하면 메타데이터 통계, 데이터의 변수별 통계 및 새로운 파생변수 5개를 포함하여 분석주제 N개를 시각화하는 웹페이지를 css, js를 포함하는 html 코드로 작성해줘.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="10" data-prompt="엑셀 데이터를 업로드하면 메타데이터 통계, 데이터의 변수별 통계 및 새로운 파생변수 5개를 포함하여 분석주제 N개를 시각화하는 웹페이지를 css, js를 포함하는 html 코드로 작성해줘.
첨부한 pptx파일의 스타일을 확인하고 비슷한 형태의 html 코드를 생성해야한다.
그리고, 컬럼이름은 반드시 확인하고, 언어(한글, 외국어 등) 문제를 피하고 csv, xls, xlsx 파일형태도 모두 읽을 수 있도록 html 코드를 생성해라.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="11" data-prompt="매일 아침 7시에 지난 24시간동안 첨부한 해당 지표가 발표되었는지 확인하고 만약 있다면 관련기사와 시장에 미치는 영향 등을 전문가 입장 리포트해줘. 개조식으로 구조적으로 작성해줘.
만약 지표가 없다면 알림을 보내지 마.">
            <span class="prompt-text"></span>
          </div>
          <div class="prompt-item" data-num="12" data-prompt="매일 오후 3시 코스피, 코스닥, 주식회사 젝시믹스의 종가와 시장의 주요 이슈에 대한 리포트를 작성해서 전달해줘.">
            <span class="prompt-text"></span>
          </div>
        </div>
      </div>

    </div>

    <!-- Toast Message -->
    <div class="toast" id="toast">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span id="toastText">클립보드에 복사되었습니다!</span>
    </div>

    <script>
      // SVG templates for copy indicator
      var copySvg =
        '<svg class="copy-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      var checkSvg =
        '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

      // Initialize Prompt Items
      document.querySelectorAll(".prompt-item").forEach(function (item) {
        // Create Number Badge from data-num attribute
        var num = document.createElement("span");
        num.className = "prompt-num";
        var promptNo = item.getAttribute("data-num");
        num.textContent = promptNo ? promptNo : "-";
        item.insertBefore(num, item.firstChild);
        
        // Inject Text Content from data-prompt
        var textEl = item.querySelector(".prompt-text");
        if (textEl && item.dataset.prompt) {
          textEl.textContent = item.dataset.prompt;
        }
        
        // Add Copy Indicator
        var ci = document.createElement("span");
        ci.className = "copy-indicator";
        ci.innerHTML = copySvg + checkSvg;
        item.appendChild(ci);
      });

      // Copy Functionality Fallback
      function fallbackCopy(text) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;left:-9999px;top:-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        var ok = false;
        try {
          ok = document.execCommand("copy");
        } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }

      function doCopy(text, cb) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard
            .writeText(text)
            .then(cb)
            .catch(function () {
              if (fallbackCopy(text)) cb();
            });
        } else {
          if (fallbackCopy(text)) cb();
        }
      }

      // Handle Prompt Click
      document.addEventListener("click", function (e) {
        var item = e.target.closest(".prompt-item");
        if (!item) return;
        
        var text = item.getAttribute("data-prompt");
        if (!text) return;
        
        doCopy(text, function () {
          // Animation & State update
          item.classList.add("copied");
          item.classList.remove("just-copied");
          void item.offsetWidth; // Trigger reflow
          item.classList.add("just-copied");
          
          showToast("클립보드에 복사되었습니다!");
        });
      });

      // Toast Notification System
      var toastTimer;
      function showToast(msg) {
        var toast = document.getElementById("toast");
        document.getElementById("toastText").textContent = msg;
        toast.classList.add("show");
        
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toast.classList.remove("show");
        }, 2000);
      }
    </script>
  </body>
</html>
